<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    php_admin_flag display_errors off
    php_admin_flag display_startup_errors off
    php_admin_flag log_errors on

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/ticket>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deployment artifacts must remain inaccessible even if a future image
    # accidentally includes them. LocationMatch also covers dot directories.
    <LocationMatch "(?i)^/ticket/(?:.*/)?(?:\.[^/]+|docker-compose[^/]*\.(?:yml|yaml)|Dockerfile[^/]*)(?:/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/ticket/(?:docker|docs|scripts|tests|backups|secrets)(?:/|$)">
        Require all denied
    </LocationMatch>
</VirtualHost>
