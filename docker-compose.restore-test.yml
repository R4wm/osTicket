# Isolated restore drill — separate project: -p osticket-restore
# Access via ingress on 127.0.0.1:8082 (web stays on internal network).
# Start db only, import osticket.sql, then enable the restore profile for web + ingress.
name: osticket-restore

services:
  db:
    image: mariadb:10.11
    networks:
      - internal
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-osticket}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - restore_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    profiles: [restore]
    build:
      context: .
      dockerfile: Dockerfile.production
    image: osticket-web:${OSTICKET_IMAGE_TAG:?Set the image tag recorded in backup metadata}
    networks:
      - internal
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-osticket}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      OSTICKET_MODE: production
    volumes:
      - type: bind
        source: ${OSTICKET_RESTORE_CONFIG_PATH:?set restore config path}
        target: /var/www/html/ticket/include/ost-config.php
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  ingress:
    profiles: [restore]
    image: nginx:alpine
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - internal
      - default
    volumes:
      - ./docker/nginx-restore-ingress.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

networks:
  default: {}
  internal:
    internal: true

volumes:
  restore_db:
